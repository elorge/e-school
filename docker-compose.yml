# docker-compose.yml
# Place this at the project root (same level as /backend).
services:
  postgres:
    image: postgres:16-alpine
    container_name: eschools-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eschools
    ports:
      - "5432:5432"
    volumes:
      - eschools-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eschools"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eschools-pgdata: